# The backend's bridge IP changes every time its container is recreated, and
# nginx resolves the names in an `upstream` block exactly once, at config load.
# That combination used to leave every request 502ing after a backend-only
# recreate until someone ran `podman kill -s HUP tuning-movie-nginx` — with the
# backend healthy the whole time, which is a slow thing to diagnose. Resolving
# `backend` per request instead removes the trap, and dropping its upstream
# block means nginx no longer needs the backend to exist to start at all.
#
# 10.1.24.1 is the gateway of the `tuning-movie-network` subnet declared in
# docker-compose.yml, where aardvark-dns answers; it is what the containers'
# own /etc/resolv.conf points at. Change the two together: a subnet change with
# a stale resolver address still passes `nginx -t` and then fails every request.
# `ipv6=off` keeps nginx from trying an AAAA the pod network does not route.
#
# `valid=10s` ADDS a cache rather than bounding one: aardvark answers with
# TTL 0, and without `valid=` nginx would re-query on every proxied request.
# Ten seconds trades that query for up to 10s of 502s after a backend recreate,
# which hides inside the backend's own startup time anyway.
#
# resolver_timeout is 30s by default, which would park a request for half a
# minute if aardvark-dns ever stops answering. Fail fast instead.
resolver 10.1.24.1 valid=10s ipv6=off;
resolver_timeout 3s;

# `resolve` (nginx >= 1.27.3; this image is 1.31.4) re-resolves the name at run
# time, so this block gets the same treatment as the backend: /monitor-api/ no
# longer breaks after an agent-only recreate, and nginx no longer needs `agent`
# to resolve in order to parse its config — which matters because nginx runs
# under `restart: unless-stopped`, so a parse failure would be a crash loop
# taking 80/443 down over a route that is deny-all to every reachable caller.
# The block is kept (rather than a variable proxy_pass) because /monitor-api/
# rewrites the URI before proxying, which the variable form does not carry.
upstream tuning_movie_agent_monitor_api {
    # `zone` is not optional here: nginx refuses `resolve` on a server whose
    # upstream is not in shared memory ("resolving names at run time requires
    # upstream ... to be in shared memory").
    zone tuning_movie_agent_monitor_api 32k;
    server agent:3500 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    set $backend_upstream "backend:3000";

    # Serve ACME challenges directly so certbot can renew without stopping nginx.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # Keep plain HTTP health available for local checks
    location /health {
        proxy_pass http://$backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    set $backend_upstream "backend:3000";

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # Health endpoint
    location /health {
        proxy_pass http://$backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # WebSocket relay
    location /agent/ws {
        proxy_pass http://$backend_upstream/agent/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Agent monitor dashboard (localhost only)
    #
    # NOTE: under rootless podman the published-port forwarder rewrites the
    # source address, so $remote_addr is nginx's own container IP for every
    # caller — including a request from the host's own loopback. "localhost"
    # here means "inside this nginx container", nothing wider: containers in
    # this pod do NOT share a network namespace either, so a sibling arrives as
    # its own bridge IP and is denied too (the agent is logged as
    # `client: 10.1.24.3`). The effective policy for every reachable caller is
    # `deny all`. It fails closed, so nothing is exposed; reach the monitor
    # directly instead:
    #   podman exec tuning-movie-agent wget -qO- http://127.0.0.1:3500/health
    # An SSH tunnel does not help — 3500 is unpublished and 10.1.24.0/24 lives
    # inside the rootless network namespace.
    location = /agent-monitor {
        return 301 /agent-monitor/;
    }

    location /agent-monitor/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        root /usr/share/nginx;
        try_files $uri $uri/ /agent-monitor/index.html;
    }

    # Agent monitor API (localhost only — same caveat as /agent-monitor/ above)
    location = /monitor-api {
        return 301 /monitor-api/;
    }

    location /monitor-api/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        rewrite ^/monitor-api/?(.*)$ /$1 break;
        proxy_pass http://tuning_movie_agent_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Main app
    location / {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/tuning-movie-access.log;
    error_log /var/log/nginx/tuning-movie-error.log;
}
