version: '3.8'

services:
  # Real study/demo sessions are served by per-session tuning-agent child
  # processes that this backend spawns itself (one per session, from
  # apps/tuning-agent/dist). The standalone `agent` service below is pinned to
  # AGENT_SESSION_ID=default and does NOT serve those sessions — it is only a
  # manual/legacy single-session runtime.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tuning-movie-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/apps/backend/data/tuning-movie.db
      - AGENT_ENABLE_OPENAI=${AGENT_ENABLE_OPENAI:-true}
      - AGENT_OPENAI_MODEL=${AGENT_OPENAI_MODEL:-gpt-5.4}
      - AGENT_OPENAI_API_MODE=${AGENT_OPENAI_API_MODE:-responses}
      # OPENAI_API_KEY is only needed when conference access codes are enabled:
      # redeeming a single-use code attaches this key to that one session,
      # server-side, so the visitor never sees it. Leave it empty and every
      # visitor must bring their own key.
      #
      # Before setting it, read the guard rails, because an operator key here is
      # otherwise drainable:
      #   - use a key minted for the demo alone, in its own OpenAI project with
      #     a hard budget limit set in the dashboard. That project cap is the
      #     only ceiling that survives a bug in this application.
      #   - keep SPEECH_PREVIEW_ALLOW_ENV_KEY unset: it would let the
      #     unauthenticated /speech/synthesize-preview route spend this key.
      #   - keep ALLOW_OPERATOR_KEY_FALLBACK unset: POST /study/sessions is
      #     unauthenticated and only demo sessions require a key, so with the
      #     fallback on, anyone could create a non-demo session and spend it.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEMO_ACCESS_CODES_ENABLED=${DEMO_ACCESS_CODES_ENABLED:-false}
      - DEMO_ACCESS_CODE_TTL_HOURS=${DEMO_ACCESS_CODE_TTL_HOURS:-24}
      - DEMO_ACCESS_MAX_FAILURES_PER_IP=${DEMO_ACCESS_MAX_FAILURES_PER_IP:-10}
      - DEMO_ACCESS_MAX_GLOBAL_FAILURES=${DEMO_ACCESS_MAX_GLOBAL_FAILURES:-100}
      # Realtime voice configuration. Baked into the ephemeral client secret the
      # backend mints; the browser never sees the real key.
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      - OPENAI_REALTIME_VOICE=${OPENAI_REALTIME_VOICE:-alloy}
      - OPENAI_REALTIME_SPEED=${OPENAI_REALTIME_SPEED:-1.5}
      - OPENAI_REALTIME_STT_MODEL=${OPENAI_REALTIME_STT_MODEL:-gpt-4o-mini-transcribe}
      - OPENAI_REALTIME_VAD_THRESHOLD=${OPENAI_REALTIME_VAD_THRESHOLD:-0.5}
      - OPENAI_REALTIME_VAD_SILENCE_MS=${OPENAI_REALTIME_VAD_SILENCE_MS:-900}
      - OPENAI_REALTIME_VAD_PREFIX_MS=${OPENAI_REALTIME_VAD_PREFIX_MS:-300}
      - REALTIME_TOKEN_TTL_SECONDS=${REALTIME_TOKEN_TTL_SECONDS:-600}
      # Relay session logs stay off; demo mode writes no logs of any kind.
      - AGENT_RELAY_LOG_ENABLED=${AGENT_RELAY_LOG_ENABLED:-false}
      # Max simultaneous public demo sessions. Demo sessions never evict each
      # other; creation over this cap is rejected with a clear error.
      - DEMO_MAX_CONCURRENT_SESSIONS=${DEMO_MAX_CONCURRENT_SESSIONS:-10}
      # Demo sessions expire on their own lifetime and are reaped once idle, so a
      # closed tab gives its demo slot (and agent process) back quickly.
      - DEMO_SESSION_TTL_MS=${DEMO_SESSION_TTL_MS:-3600000}
      - DEMO_SESSION_IDLE_TIMEOUT_MS=${DEMO_SESSION_IDLE_TIMEOUT_MS:-900000}
      - AGENT_LLM_DEBUG=${AGENT_LLM_DEBUG:-false}
      - AGENT_MONITOR_ENABLED=${AGENT_MONITOR_ENABLED:-false}
    volumes:
      - ./apps/backend/data:/app/apps/backend/data:z
      # Access codes live here; without this a rebuild would invalidate every
      # printed card mid-event.
      - ./apps/backend/.runtime:/app/apps/backend/.runtime:z
      - ./logs/interaction:/app/logs/interaction:z
      - ./logs/trace:/app/logs/trace:z
      - ./logs/survey:/app/logs/survey:z
    networks:
      - tuning-movie-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Standalone single-session agent (AGENT_SESSION_ID=default). It does not
  # serve study or demo sessions — the backend spawns its own per-session agent
  # processes for those. Useful for manual relay testing only; a public demo
  # deployment can leave OPENAI_API_KEY empty here (or drop this service).
  agent:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.agent
    container_name: tuning-movie-agent
    restart: unless-stopped
    environment:
      - AGENT_RELAY_URL=ws://backend:3000/agent/ws
      - AGENT_SESSION_ID=${AGENT_SESSION_ID:-default}
      - AGENT_NAME=${AGENT_NAME:-tuning-agent}
      - AGENT_STUDY_ID=${AGENT_STUDY_ID:-pilot-01}
      - AGENT_PARTICIPANT_ID=${AGENT_PARTICIPANT_ID:-P00-EXAMPLE}
      - AGENT_MONITOR_PORT=3500
      - AGENT_MONITOR_WEB_PORT=3501
      - AGENT_MONITOR_ENABLED=${AGENT_MONITOR_ENABLED:-true}
      - AGENT_ENABLE_OPENAI=${AGENT_ENABLE_OPENAI:-true}
      - AGENT_OPENAI_MODEL=${AGENT_OPENAI_MODEL:-gpt-5.4}
      - AGENT_OPENAI_API_MODE=${AGENT_OPENAI_API_MODE:-responses}
      - AGENT_LLM_DEBUG=${AGENT_LLM_DEBUG:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tuning-movie-network
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^node$' /proc/1/comm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nginx
    container_name: tuning-movie-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro,z
      - ./deploy/certbot/www:/var/www/certbot:z
      - ./deploy/ssl:/etc/nginx/ssl:ro,z
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - tuning-movie-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  tuning-movie-network:
    name: tuning-movie-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.24.0/24
