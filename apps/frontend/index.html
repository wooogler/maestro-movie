<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      `viewport-fit=cover` lets the page paint into a tablet's rounded corners
      and under the home indicator once it is installed; the layout keeps its
      controls clear of those areas through the safe-area padding in index.css.
      `user-scalable=no` is deliberately NOT set — pinch-zoom stays available.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installable: added to a tablet's home screen, it launches without browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- iPadOS and iOS ignore the manifest's display mode and read these instead. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MAESTRO" />

    <title>TUNING Movie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered after load so it never delays first paint at the booth. The
      // worker caches nothing; see public/sw.js for why.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Not installable on this browser. The app works exactly the same.
          });
        });
      }
    </script>
  </body>
</html>
